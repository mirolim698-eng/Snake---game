<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Snake Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      touch-action: manipulation;
    }

    h1 {
      margin: 15px 0 5px;
    }

    #score {
      font-size: 20px;
      margin-bottom: 10px;
    }

    canvas {
      background: #222;
      border: 3px solid #555;
      width: min(92vw, 400px);
      height: min(92vw, 400px);
    }

    .controls {
      width: 210px;
      margin: 15px auto;
      display: grid;
      grid-template-columns: 70px 70px 70px;
      grid-template-rows: 60px 60px;
      gap: 5px;
    }

    button {
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 28px;
      font-weight: bold;
      touch-action: manipulation;
    }

    button:active {
      background: #00aa44;
      transform: scale(0.95);
    }

    .up {
      grid-column: 2;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .restart {
      margin-top: 5px;
      padding: 10px 25px;
      font-size: 18px;
      background: #555;
    }
  </style>
</head>

<body>

  <h1>🐍 Snake</h1>

  <div id="score">Ball: 0</div>

  <canvas id="game"
          width="400"
          height="400">
  </canvas>

  <!-- Telefon tugmalari -->
  <div class="controls">

    <button class="up"
            onclick="changeDirection(0, -1)">
      ↑
    </button>

    <button class="left"
            onclick="changeDirection(-1, 0)">
      ←
    </button>

    <button class="down"
            onclick="changeDirection(0, 1)">
      ↓
    </button>

    <button class="right"
            onclick="changeDirection(1, 0)">
      →
    </button>

  </div>

  <button class="restart"
          onclick="restart()">
    🔄 Qayta boshlash
  </button>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const count = canvas.width / size;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;


function restart() {

  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];

  dx = 1;
  dy = 0;

  score = 0;
  gameOver = false;

  createFood();
  updateScore();
}


function createFood() {

  food = {
    x: Math.floor(Math.random() * count),
    y: Math.floor(Math.random() * count)
  };

  for (let part of snake) {

    if (
      part.x === food.x &&
      part.y === food.y
    ) {
      createFood();
      return;
    }
  }
}


function updateScore() {

  document.getElementById("score").textContent =
    "Ball: " + score;
}


/* Yo‘nalishni o‘zgartirish */

function changeDirection(newDx, newDy) {

  // Orqaga qaytishga ruxsat bermaymiz
  if (
    newDx === -dx &&
    newDy === -dy
  ) {
    return;
  }

  dx = newDx;
  dy = newDy;
}


/* O‘yinni chizish */

function draw() {

  if (gameOver) {

    ctx.fillStyle = "#111";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "32px Arial";

    ctx.fillText(
      "O‘yin tugadi!",
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.font = "20px Arial";

    ctx.fillText(
      "🔄 Qayta boshlang",
      canvas.width / 2,
      canvas.height / 2 + 40
    );

    return;
  }


  /* Fon */

  ctx.fillStyle = "#222";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* Ovqat */

  ctx.fillStyle = "red";

  ctx.beginPath();

  ctx.arc(
    food.x * size + size / 2,
    food.y * size + size / 2,
    size / 2 - 2,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Ilon */

  snake.forEach((part, index) => {

    ctx.fillStyle =
      index === 0
        ? "#00ff66"
        : "#00aa44";

    ctx.fillRect(
      part.x * size + 1,
      part.y * size + 1,
      size - 2,
      size - 2
    );

  });


  /* Yangi bosh */

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };


  /* Devorga urilish */

  if (
    head.x < 0 ||
    head.x >= count ||
    head.y < 0 ||
    head.y >= count
  ) {

    gameOver = true;
    return;
  }


  /* O‘ziga urilish */

  for (let part of snake) {

    if (
      head.x === part.x &&
      head.y === part.y
    ) {

      gameOver = true;
      return;
    }
  }


  snake.unshift(head);


  /* Ovqat yeyish */

  if (
    head.x === food.x &&
    head.y === food.y
  ) {

    score++;

    updateScore();

    createFood();

  } else {

    snake.pop();

  }

}


/* Klaviatura ham ishlaydi */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "ArrowUp") {
      changeDirection(0, -1);
    }

    if (e.key === "ArrowDown") {
      changeDirection(0, 1);
    }

    if (e.key === "ArrowLeft") {
      changeDirection(-1, 0);
    }

    if (e.key === "ArrowRight") {
      changeDirection(1, 0);
    }

  }
);


restart();

setInterval(draw, 120);

</script>

</body>
</html>
